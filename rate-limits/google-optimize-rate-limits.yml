description: >-
  Rate limit record for Google Optimize. NO RATE LIMITS ARE PUBLISHED, because no API remains. The
  developer portal at developers.google.com/optimize redirects in full to the sunset notice, the
  documented base https://www.googleapis.com/optimize/v1 returns HTTP 404, and Google's own API
  Discovery directory — 530 services on 2026-09-12 — contains no Optimize entry, so there is no
  surface left to throttle and no runtime headers to observe.
limit_count: 0
