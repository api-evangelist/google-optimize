specification: API Commons Packages
specificationVersion: '0.1'
provider: Google Optimize
providerId: google-optimize
generated: '2026-09-12'
modified: '2026-09-12'
method: searched
source: >-
  npm registry metadata (registry.npmjs.org), the Google Optimize sunset notice, and the
  google / googleapis / GoogleCloudPlatform GitHub organizations.
description: >-
  Client library inventory for Google Optimize. THE HEADLINE FINDING IS AN ABSENCE: Google never
  published a first-party server-side SDK for Optimize in any language registry, and the one
  first-party distribution that did exist — the optimize.js container snippet served from
  www.googleoptimize.com — was a CDN script tag, not a package, and no longer serves a container
  after the 2023-09-30 sunset. Everything listed below with official:false is a community wrapper
  around that snippet, and every one of them is abandoned.
official_sdk_count: 0
package_count: 6
ownership_note: >-
  STEP 0c ownership check. Several npm and PyPI packages match the word "optimize" under Google
  ownership and NONE of them belongs to this product: @google-cloud/optimization and the archived
  googleapis/python-optimization and googleapis/java-optimization repositories are Google Cloud
  Optimization AI (fleet routing), @google-cloud/appoptimize is Google Cloud App Optimize, and
  google/vizier is blackbox optimization research. They are deliberately excluded rather than
  credited to Google Optimize.
packages:
  - name: optimize.js container snippet
    registry: cdn
    official: true
    language: javascript
    url: https://www.googleoptimize.com/optimize.js
    version: null
    published: null
    status: retired
    note: >-
      The only first-party distribution Google Optimize ever shipped: an unversioned, unpinned
      script tag loaded as https://www.googleoptimize.com/optimize.js?id=OPT-XXXXXXX. There is no
      registry metadata endpoint to query and the URL was never pinned to a version, so a consumer
      could not tell what build they were getting either — hence version: null. Probed 2026-09-12:
      the script path returns HTTP 400 and the domain root returns HTTP 404; the host still
      resolves to Google infrastructure but serves no experiment container.
