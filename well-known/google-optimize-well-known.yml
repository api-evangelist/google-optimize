method: probed
source: >-
  Anonymous HTTPS probes of /.well-known/ on every host this record names — the
  registrable domain and www, the API baseURL host, the documentation host, the
  retired product console host, and the Google Marketing Platform marketing host.
description: >-
  Well-known discovery probe for Google Optimize. Google Optimize and Optimize 360 were
  sunset on 2023-09-30 and the product serves no /.well-known/ documents of its own; the
  only real document found on any probed host is the corporate Google security.txt served
  from google.com and www.google.com, which is published by Google the parent company and
  covers the whole estate rather than this retired product.
notes:
  - >-
    FALSE-POSITIVE WARNING — support.google.com and optimize.google.com answer HTTP 200 to
    EVERY /.well-known/ path with the same ~1.5 MB Google Help Center SPA shell (identical
    byte counts across unrelated paths). These are catch-all HTML responses, not documents,
    and are recorded below with shell: true so nothing downstream mistakes them for a hit.
  - >-
    optimize.google.com does not serve a console any more; it 302s to the sunset notice at
    support.google.com/analytics/answer/12979939.
