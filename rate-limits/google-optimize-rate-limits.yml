note: >-
  This file REPLACES a 2026-05-04 bulk-sweep scaffold that asserted concrete numbers Google never
  published — 10 requests/minute free, 100/minute professional, 1,000/minute enterprise, a
  1,000-request monthly free quota, and a full X-RateLimit-* / Retry-After header set. None of it
  was ever documented by the provider and none of it is observable, because the endpoint is gone.
  An honest zero is the measurement.
