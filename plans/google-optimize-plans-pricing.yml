note: >-
  This file REPLACES a 2026-05-04 bulk-sweep scaffold that asserted Free / Professional /
  Enterprise tiers with invented quotas (1,000 requests/month free, 100,000 professional, TBD
  pricing). Google Optimize never had those tiers. The product shipped in two editions — Optimize,
  which was free, and Optimize 360, which was sold as part of Google Marketing Platform through a
  sales conversation with no published list price — and both were switched off on 2023-09-30. The
  scaffold values were removed rather than corrected because there is nothing live to correct them
  to.
