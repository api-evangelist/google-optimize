description: >-
  Plans and pricing record for Google Optimize. THERE ARE NO PUBLISHED PLANS. Google Optimize and
  Optimize 360 were sunset on 2023-09-30, the Google Marketing Platform product page for Optimize
  is gone (marketingplatform.google.com/about/optimize/ redirects to /about/, which no longer
  lists the product), and no pricing page for either edition remains anywhere on Google's site.
  Nothing can be purchased, provisioned, or metered.
